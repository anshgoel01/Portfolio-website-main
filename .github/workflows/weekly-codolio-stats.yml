name: Daily Codolio Stats Update

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC (7:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Codolio scraper
        run: node scripts/scrape-codolio.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/codolio-stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit — stats are already up to date."
          else
            git commit -m "chore: update Codolio stats [skip ci]"
            git push origin HEAD:main
            echo "Stats updated and pushed to main."
          fi
